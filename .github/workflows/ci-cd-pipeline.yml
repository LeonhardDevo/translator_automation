name: AI Translation Service CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  development-stage:
    name: Development Stage
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js for frontend linting and testing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Set up Python for backend linting and testing
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      # Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit flake8

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Code linting and formatting
      - name: Backend code linting
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Frontend code linting
        run: |
          cd frontend
          npm run lint

      # Unit tests execution
      - name: Backend unit tests
        run: |
          python -m pytest backend/ -v --cov=backend --cov-report=xml

      - name: Frontend unit tests
        run: |
          cd frontend
          npm test -- --coverage --passWithNoTests

      # Security scanning
      - name: Backend security scan
        run: |
          bandit -r backend/ -ll

      # Dependency vulnerability checks
      - name: Backend dependency check
        run: |
          pip install safety
          safety check -r requirements.txt

      - name: Frontend dependency check
        run: |
          cd frontend
          npm audit --audit-level moderate

      # Extract metadata for Docker images
      - name: Extract Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

  build-stage:
    name: Build Stage
    needs: development-stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to container registry
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push backend Docker image
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ needs.development-stage.outputs.backend-image }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push frontend Docker image
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ needs.development-stage.outputs.frontend-image }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testing-stage:
    name: Testing Stage
    needs: [development-stage, build-stage]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-docker-compose

      # Integration tests
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v

      # Security tests
      - name: Run security tests
        run: |
          pip install pytest-security
          python -m pytest tests/security/ -v

      # Performance tests
      - name: Run performance tests
        run: |
          pip install locust
          python -c "print('Performance tests would run here')"

  staging-stage:
    name: Staging Stage
    if: github.ref == 'refs/heads/main'
    needs: [development-stage, build-stage, testing-stage]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy to staging environment
      - name: Deploy to staging
        run: |
          # Deploy using the infrastructure in terraform directory
          cd terraform
          # Initialize terraform with staging variables
          # This is a simplified example - in real world you'd have specific staging vars
          echo "Deploying to staging environment..."
          # Here you would typically run:
          # terraform init
          # terraform apply -var-file=staging.tfvars -auto-approve

      # Run smoke tests
      - name: Run smoke tests
        run: |
          # Simple health check
          sleep 30  # Wait for deployment to settle
          # curl -f http://staging-endpoint/health || exit 1
          echo "Smoke tests completed"

      # Quality gates
      - name: Automated quality gates
        run: |
          # Check deployment metrics, error rates, etc.
          echo "Quality gates passed"

  production-stage:
    name: Production Stage
    if: github.ref == 'refs/heads/main'
    needs: [staging-stage]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy to production with blue-green deployment
      - name: Deploy to production (Blue-Green)
        run: |
          echo "Starting blue-green deployment to production..."
          # In a real scenario, this would implement blue-green deployment
          # using ECS, EKS, or other deployment strategies
          # Example:
          # aws ecs deploy --service ai-translation-service --cluster production-cluster
          # Or use Terraform to manage the deployment
          cd terraform
          # terraform init
          # terraform apply -var-file=prod.tfvars -auto-approve

      # Run health checks
      - name: Run health checks
        run: |
          sleep 60  # Wait for deployment to settle
          # curl -f http://production-endpoint/health || exit 1
          echo "Health checks passed"

      # Set up notifications and alerts
      - name: Notify deployment success
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": ":rocket: Production deployment successful!\nRepository: ${{ github.repository }}\nCommit: ${{ github.sha }}\nDeployed by: ${{ github.actor }}"
            }

      # Rollback procedure (manual trigger)
      - name: Setup rollback procedure
        run: |
          echo "Rollback procedure documented in RUNBOOK.md"
          # In a real scenario, you would have automatic rollback triggers
          # based on health checks or manual approval

  notify:
    name: Notification
    needs: [development-stage, build-stage, testing-stage, staging-stage, production-stage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify status
        uses: slackapi/slack-github-action@v1.26.0
        if: needs.production-stage.result == 'success'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": ":white_check_mark: CI/CD Pipeline completed successfully!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nStatus: Success"
            }